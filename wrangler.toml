# ─── Cloudflare Pages — Nexa Web ─────────────────────────────────────────────
# Ce fichier était écrit au format Workers : une section « [assets] » avec
# « directory ». Cloudflare PAGES ne lit pas cette forme. Quand il trouve un
# wrangler.toml sans « pages_build_output_dir », il refuse le build au lieu de
# l'ignorer — c'est la cause la plus probable du run en échec.
#
# Le format Pages n'a qu'une clé utile ici : le dossier produit par le build.
# La COMMANDE de build, elle, ne se met pas dans ce fichier : elle vit dans le
# tableau de bord Cloudflare (Build command). Elle doit être « npm run build ».
name = "nexaweb-site"
compatibility_date = "2024-09-23"
pages_build_output_dir = "dist"
