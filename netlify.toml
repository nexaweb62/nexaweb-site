# ─── Netlify — Nexa Web ───────────────────────────────────────────────────────
# Site Astro : sortie statique dans dist/, aucun JS de framework a l'execution.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# ─── En-tetes de securite (toutes les pages) ─────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options            = "SAMEORIGIN"
    X-Content-Type-Options     = "nosniff"
    Referrer-Policy            = "strict-origin-when-cross-origin"
    Permissions-Policy         = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security  = "max-age=31536000; includeSubDomains; preload"

# ─── Cache des medias (noms stables : renommer le fichier pour invalider) ────
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ─── Domaine canonique : www → apex ──────────────────────────────────────────
[[redirects]]
  from   = "https://www.nexaaweb.com/*"
  to     = "https://nexaaweb.com/:splat"
  status = 301
  force  = true

# ─────────────────────────────────────────────────────────────────────────────
