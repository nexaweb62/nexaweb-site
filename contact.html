/* ── TOKENS ── */
:root{
  --bg:#080811;--text:#E8E8F2;--muted:rgba(232,232,242,.44);--text-muted:rgba(232,232,242,.44);
  --accent:#8B5CF6;--accent-dim:rgba(139,92,246,.15);--accent-ring:rgba(139,92,246,.35);
  --border:rgba(232,232,242,.08);--border-hi:rgba(232,232,242,.14);
  --btn-bg:#E8E8F2;--btn-text:#080811;
  --font:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --hdr:80px;
}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#F4F4F0;--text:#111118;--muted:rgba(17,17,22,.50);--text-muted:rgba(17,17,22,.50);
  --border:rgba(18,18,22,.09);--border-hi:rgba(18,18,22,.16);
  --btn-bg:#111118;--btn-text:#F4F4F0;
}}
:root[data-theme="light"]{
  --bg:#F4F4F0;--text:#111118;--muted:rgba(17,17,22,.50);--text-muted:rgba(17,17,22,.50);
  --border:rgba(18,18,22,.09);--border-hi:rgba(18,18,22,.16);
  --btn-bg:#111118;--btn-text:#F4F4F0;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
body{font-family:var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{cursor:pointer;border:none;background:none;font:inherit;color:inherit}

/* ── GLOBE CANVAS ── */
#globe-canvas{
  position:fixed;inset:0;
  width:100%;height:100%;
  cursor:grab;z-index:0;
  display:block;
}
#globe-canvas:active{cursor:grabbing}

/* ── LOADING ── */
#globe-loading{
  position:fixed;inset:0;z-index:200;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:18px;
  background:var(--bg);
  transition:opacity .6s;
}
#globe-loading.out{opacity:0;pointer-events:none}
.gl-spinner{
  width:28px;height:28px;
  border:2px solid var(--border-hi);
  border-top-color:var(--accent);
  border-radius:50%;
  animation:spin .75s linear infinite;
}
.gl-loading-text{font-size:9px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
@keyframes spin{to{transform:rotate(360deg)}}

.menu-btn{width:36px;height:36px;border:1px solid var(--border-hi);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;transition:border-color .2s,color .2s,background .2s;flex-shrink:0;background:none}
.menu-btn:hover{border-color:rgba(139,92,246,.55);color:var(--text);background:rgba(139,92,246,.09)}
.menu-btn svg{width:15px;height:15px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round}
.cnav{position:fixed;inset:0;z-index:9000;display:flex;align-items:center;justify-content:center;background:rgba(4,3,14,.90);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);opacity:0;pointer-events:none;transition:opacity .32s cubic-bezier(.16,1,.3,1)}
.cnav.open{opacity:1;pointer-events:all}
.cnav-ring{position:relative;width:420px;height:420px;max-width:88vw;max-height:88vw;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(139,92,246,.04);border:1px solid rgba(139,92,246,.18);box-shadow:0 0 90px rgba(139,92,246,.07),inset 2px 2px 5px rgba(255,255,255,.05),inset -2px -2px 5px rgba(0,0,0,.28);transform:scale(0);transition:transform .44s cubic-bezier(.16,1,.3,1)}
.cnav.open .cnav-ring{transform:scale(1)}
.cnav-close{width:54px;height:54px;border-radius:50%;background:#E8E8F2;color:#080811;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .24s,background .24s,color .24s;position:relative;z-index:1}
.cnav-close:hover{background:#8B5CF6;color:#fff;transform:scale(1.1) rotate(90deg)}
.cnav-close svg{width:20px;height:20px;stroke:currentColor;stroke-width:2.5;fill:none;stroke-linecap:round}
.cnav-item{position:absolute;top:50%;left:50%}
.cnav-link{display:flex;flex-direction:column;align-items:center;justify-content:center;width:74px;height:74px;border-radius:50%;color:rgba(232,232,242,.60);text-decoration:none;transition:background .22s,color .22s,transform .22s,box-shadow .22s;gap:4px}
.cnav-link:hover{background:rgba(139,92,246,.22);color:#fff;transform:scale(1.09);box-shadow:0 0 26px rgba(139,92,246,.20)}
.cnav-link svg{width:21px;height:21px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.cnav-name{font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}

/* ── HEADER ── */
.hdr{
  position:fixed;top:0;left:0;right:0;
  height:var(--hdr);z-index:100;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 clamp(20px,5vw,80px);
  background:rgba(8,8,17,.75);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid var(--border);
}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]) .hdr{background:rgba(244,244,240,.85)}}
:root[data-theme="light"] .hdr{background:rgba(244,244,240,.85)}
.nav-logo{font-size:14px;font-weight:900;letter-spacing:.08em;color:var(--text)}
.nav-logo span{color:var(--muted)}
.nav-r{display:flex;align-items:center;gap:14px}
.back-btn{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:600;letter-spacing:.10em;text-transform:uppercase;color:var(--muted);border:1px solid var(--border-hi);border-radius:2px;padding:8px 14px;transition:color .2s,border-color .2s;white-space:nowrap}
.back-btn:hover{color:var(--text);border-color:var(--muted)}
.back-btn svg{width:11px;height:11px;stroke:currentColor;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.theme-btn,.login-btn{
  width:30px;height:30px;
  border:1px solid var(--border-hi);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:var(--muted);font-size:13px;
  transition:border-color .2s,color .2s;
}
.theme-btn:hover,.login-btn:hover{border-color:var(--muted);color:var(--text)}
.login-btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn-nav{
  display:inline-flex;align-items:center;gap:9px;
  background:var(--btn-bg);color:var(--btn-text);
  font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
  padding:12px 24px;border-radius:2px;
  transition:opacity .2s;
}
.btn-nav:hover{opacity:.82}
@media(max-width:600px){.btn-nav{display:none}}

/* ── PAGE TITLE ── */
.contact-head{
  position:fixed;
  top:calc(var(--hdr) + 40px);
  left:clamp(20px,5vw,80px);
  z-index:10;pointer-events:none;
}
.contact-eyebrow{
  font-size:9px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;
  color:var(--accent);margin-bottom:10px;
}
.contact-title{
  font-size:clamp(1.7rem,3.8vw,3rem);
  font-weight:900;letter-spacing:-.04em;line-height:.96;
  color:var(--text);
}
.contact-title em{font-style:italic;color:var(--muted)}

/* ── CARVIN LABEL ── */
#carvin-pin{
  position:fixed;
  z-index:30;
  pointer-events:none;
  display:flex;flex-direction:column;align-items:center;gap:4px;
  transform:translate(-50%,-100%) translateY(-10px);
  opacity:0;
  transition:opacity .4s;
}
#carvin-pin.visible{opacity:1}
.carvin-badge{
  font-size:8px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
  color:var(--text);
  background:rgba(8,8,17,.72);
  border:1px solid var(--accent-ring);
  padding:3px 9px;border-radius:4px;
  backdrop-filter:blur(8px);
  white-space:nowrap;
}
:root[data-theme="light"] .carvin-badge{background:rgba(244,244,240,.85)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]) .carvin-badge{background:rgba(244,244,240,.85)}}
.carvin-line{width:1px;height:12px;background:linear-gradient(to bottom,var(--accent),transparent)}
.carvin-dot{
  width:10px;height:10px;border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 0 0 rgba(139,92,246,.6);
  animation:carvin-beat 2s ease-out infinite;
}
@keyframes carvin-beat{
  0%  {box-shadow:0 0 0 0 rgba(139,92,246,.7)}
  70% {box-shadow:0 0 0 14px rgba(139,92,246,0)}
  100%{box-shadow:0 0 0 0 rgba(139,92,246,0)}
}

/* ── FLOATING CONTACT BUTTONS ── */
.c-btn{
  position:fixed;
  z-index:50;
  display:inline-flex;align-items:center;gap:10px;
  padding:11px 20px;
  background:rgba(10,10,20,.22);
  border:1px solid rgba(232,232,242,.13);
  border-radius:100px;
  color:var(--text);
  font-family:var(--font);
  font-size:12px;font-weight:500;letter-spacing:.03em;
  text-decoration:none;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  white-space:nowrap;
  cursor:pointer;
  transition:background .25s,border-color .25s,transform .25s;
  user-select:none;
}
.c-btn:hover{
  background:rgba(139,92,246,.18);
  border-color:rgba(139,92,246,.40);
  transform:translateY(-3px) !important;
}
.c-btn svg{width:14px;height:14px;flex-shrink:0;color:var(--accent)}
:root[data-theme="light"] .c-btn{background:rgba(255,255,255,.35);border-color:rgba(18,18,22,.14)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]) .c-btn{background:rgba(255,255,255,.35);border-color:rgba(18,18,22,.14)}}

/* Positions + float animations */
.c-btn-1{bottom:30%;left:7%;animation:fl1 5.2s ease-in-out infinite}
.c-btn-2{bottom:36%;right:7%;animation:fl2 6.0s ease-in-out infinite}
.c-btn-3{bottom:12%;left:50%;transform:translateX(-50%);animation:fl3 4.8s ease-in-out infinite}
.c-btn-4{bottom:20%;right:7%;animation:fl2 5.6s ease-in-out infinite 1.2s}

@keyframes fl1{0%,100%{transform:translateY(0)}        50%{transform:translateY(-11px)}}
@keyframes fl2{0%,100%{transform:translateY(-7px)}     50%{transform:translateY(7px)}}
@keyframes fl3{
  0%,100%{transform:translateX(-50%) translateY(0)}
  50%{transform:translateX(-50%) translateY(-9px)}
}
.c-btn-3:hover{transform:translateX(-50%) translateY(-3px) !important}

@media(max-width:600px){
  .c-btn{font-size:11px;padding:9px 15px;gap:8px}
  .c-btn-1{bottom:28%;left:4%}
  .c-btn-2{bottom:34%;right:4%}
  .c-btn-3{bottom:10%}
  .c-btn-4{bottom:22%;right:4%}
}
</style>
</head>

<script>
/* ── Theme toggle ── */
(function(){
  var root=document.documentElement;
  var btn=document.getElementById('theme-btn');
  function sync(){btn.textContent=root.getAttribute('data-theme')==='light'?'●':'○';}
  sync();
  btn.addEventListener('click',function(){
    var next=root.getAttribute('data-theme')==='dark'?'light':'dark';
    root.setAttribute('data-theme',next);
    localStorage.setItem('nw-theme',next);
    sync();
  });
})();

/* ── Globe ── */
(function(){
  var CARVIN   = [2.9598, 50.4914]; /* [lng, lat] */
  var GEOJSON  = 'https://raw.githubusercontent.com/martynafford/natural-earth-geojson/refs/heads/master/110m/physical/ne_110m_land.json';
  var DOT_STEP = 1.8; /* degrés entre chaque point */

  var canvas   = document.getElementById('globe-canvas');
  var ctx      = canvas.getContext('2d');
  var loadEl   = document.getElementById('globe-loading');
  var pinEl    = document.getElementById('carvin-pin');

  var W, H, radius, DPR;
  var rotation = [-2, -25]; /* centré sur l'Europe au démarrage */
  var autoRotate  = true;
  var rotSpeed    = 0.12;
  var landFeatures = null;
  var allDots      = [];
  var rafId;

  /* ── Projection ── */
  var projection = d3.geoOrthographic().clipAngle(90);
  var geoPath    = d3.geoPath().projection(projection).context(ctx);
  var graticule  = d3.geoGraticule()();

  function setProjection(){
    projection.scale(radius).translate([W/2, H/2]).rotate(rotation);
  }

  function resize(){
    DPR    = Math.min(window.devicePixelRatio||1, 2);
    W      = window.innerWidth;
    H      = window.innerHeight;
    radius = Math.min(W, H) * 0.44;
    canvas.width  = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    setProjection();
  }

  /* ── Dot generation ── */
  function ptInPoly(pt, ring){
    var x=pt[0], y=pt[1], inside=false;
    for(var i=0, j=ring.length-1; i<ring.length; j=i++){
      var xi=ring[i][0], yi=ring[i][1], xj=ring[j][0], yj=ring[j][1];
      if((yi>y)!==(yj>y) && x<((xj-xi)*(y-yi))/(yj-yi)+xi) inside=!inside;
    }
    return inside;
  }

  function ptInFeature(pt, f){
    var g=f.geometry;
    if(g.type==='Polygon'){
      if(!ptInPoly(pt,g.coordinates[0])) return false;
      for(var i=1;i<g.coordinates.length;i++) if(ptInPoly(pt,g.coordinates[i])) return false;
      return true;
    }
    if(g.type==='MultiPolygon'){
      for(var p=0;p<g.coordinates.length;p++){
        var poly=g.coordinates[p];
        if(ptInPoly(pt,poly[0])){
          var hole=false;
          for(var h=1;h<poly.length;h++) if(ptInPoly(pt,poly[h])){hole=true;break;}
          if(!hole) return true;
        }
      }
    }
    return false;
  }

  function buildDots(features){
    var dots=[];
    features.forEach(function(f){
      var b=d3.geoBounds(f);
      var minLng=b[0][0], minLat=b[0][1], maxLng=b[1][0], maxLat=b[1][1];
      for(var lng=minLng; lng<=maxLng; lng+=DOT_STEP){
        for(var lat=minLat; lat<=maxLat; lat+=DOT_STEP){
          var pt=[lng,lat];
          if(ptInFeature(pt,f)) dots.push(pt);
        }
      }
    });
    return dots;
  }

  /* ── Render ── */
  function render(ts){
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.clearRect(0,0,W,H);

    /* Globe sphere */
    ctx.beginPath();
    ctx.arc(W/2, H/2, radius, 0, Math.PI*2);
    ctx.fillStyle='rgba(6,5,15,1)';
    ctx.fill();
    ctx.strokeStyle='rgba(139,92,246,.30)';
    ctx.lineWidth=1.2;
    ctx.stroke();

    /* Graticule */
    ctx.beginPath();
    geoPath(graticule);
    ctx.strokeStyle='rgba(139,92,246,.09)';
    ctx.lineWidth=0.5;
    ctx.stroke();

    /* Land outlines */
    if(landFeatures){
      ctx.beginPath();
      landFeatures.features.forEach(function(f){ geoPath(f); });
      ctx.strokeStyle='rgba(139,92,246,.25)';
      ctx.lineWidth=0.7;
      ctx.stroke();
    }

    /* Land dots */
    ctx.fillStyle='rgba(139,92,246,.60)';
    allDots.forEach(function(dot){
      var p=projection(dot);
      if(!p) return;
      ctx.beginPath();
      ctx.arc(p[0], p[1], 1.1, 0, Math.PI*2);
      ctx.fill();
    });

    /* Carvin pulse marker */
    var cp=projection(CARVIN);
    if(cp){
      var cx=cp[0], cy=cp[1];
      var t=(ts||0)/1000;

      /* 2 expanding rings offset by 1s */
      [0, 1].forEach(function(offset){
        var phase=((t+offset)%2)/2;
        var r=5+phase*18;
        var a=(1-phase)*0.55;
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI*2);
        ctx.strokeStyle='rgba(139,92,246,'+a+')';
        ctx.lineWidth=1.5;
        ctx.stroke();
      });

      /* Core */
      ctx.beginPath();
      ctx.arc(cx, cy, 4.5, 0, Math.PI*2);
      ctx.fillStyle='#8B5CF6';
      ctx.shadowColor='rgba(139,92,246,.9)';
      ctx.shadowBlur=10;
      ctx.fill();
      ctx.shadowBlur=0;

      /* White centre */
      ctx.beginPath();
      ctx.arc(cx, cy, 2, 0, Math.PI*2);
      ctx.fillStyle='#fff';
      ctx.fill();

      /* DOM label position */
      pinEl.style.left = cx+'px';
      pinEl.style.top  = (cy-8)+'px';
      pinEl.classList.add('visible');
    } else {
      pinEl.classList.remove('visible');
    }
  }

  /* ── Loop ── */
  function tick(ts){
    if(autoRotate){
      rotation[0]+=rotSpeed;
      setProjection();
    }
    render(ts);
    rafId=requestAnimationFrame(tick);
  }

  /* ── Mouse / touch drag ── */
  function startDrag(startX, startY){
    autoRotate=false;
    var r0=[rotation[0], rotation[1]];
    return function move(dx, dy){
      rotation[0]=r0[0]+dx*0.38;
      rotation[1]=Math.max(-90,Math.min(90, r0[1]-dy*0.38));
      setProjection();
    };
  }

  canvas.addEventListener('mousedown',function(e){
    var move=startDrag(e.clientX, e.clientY);
    var sx=e.clientX, sy=e.clientY;
    function mm(e){ move(e.clientX-sx, e.clientY-sy); }
    function mu(){
      document.removeEventListener('mousemove',mm);
      document.removeEventListener('mouseup',mu);
      setTimeout(function(){autoRotate=true;},1200);
    }
    document.addEventListener('mousemove',mm);
    document.addEventListener('mouseup',mu);
  });

  canvas.addEventListener('touchstart',function(e){
    var t0=e.touches[0];
    var move=startDrag(t0.clientX, t0.clientY);
    var sx=t0.clientX, sy=t0.clientY;
    function tm(e){ var t=e.touches[0]; move(t.clientX-sx, t.clientY-sy); }
    function te(){
      canvas.removeEventListener('touchmove',tm);
      canvas.removeEventListener('touchend',te);
      setTimeout(function(){autoRotate=true;},1200);
    }
    canvas.addEventListener('touchmove',tm,{passive:true});
    canvas.addEventListener('touchend',te);
  },{passive:true});

  /* Scroll to zoom */
  canvas.addEventListener('wheel',function(e){
    e.preventDefault();
    var f=e.deltaY>0?0.92:1.09;
    radius=Math.max(Math.min(W,H)*0.28, Math.min(Math.min(W,H)*0.72, radius*f));
    setProjection();
  },{passive:false});

  /* ── Init ── */
  resize();
  window.addEventListener('resize', resize, {passive:true});

  fetch(GEOJSON)
    .then(function(r){ return r.json(); })
    .then(function(data){
      landFeatures=data;
      allDots=buildDots(data.features);
      loadEl.classList.add('out');
      setTimeout(function(){ loadEl.remove(); }, 700);
      rafId=requestAnimationFrame(tick);
    })
    .catch(function(){
      loadEl.classList.add('out');
      setTimeout(function(){ loadEl.remove(); }, 700);
      rafId=requestAnimationFrame(tick);
    });
})();
</script>
<script>
(function(){
  var overlay=document.getElementById('cnav'),ring=document.getElementById('cnav-ring'),menuBtn=document.getElementById('menu-btn'),closeBtn=document.getElementById('cnav-close');
  if(!overlay||!ring||!menuBtn)return;
  var items=Array.from(ring.querySelectorAll('.cnav-item')),n=items.length;
  function pos(){var s=ring.offsetWidth,r=s*0.368;items.forEach(function(it,i){var a=((360/n)*i-90)*Math.PI/180;it.style.transform='translate(calc(-50% + '+(Math.cos(a)*r).toFixed(1)+'px),calc(-50% + '+(Math.sin(a)*r).toFixed(1)+'px))';});}
  function open(){overlay.classList.add('open');menuBtn.setAttribute('aria-expanded','true');document.body.style.overflow='hidden';pos();closeBtn.focus();}
  function close(){overlay.classList.remove('open');menuBtn.setAttribute('aria-expanded','false');document.body.style.overflow='';menuBtn.focus();}
  menuBtn.addEventListener('click',open);closeBtn.addEventListener('click',close);
  overlay.addEventListener('click',function(e){if(e.target===overlay)close();});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&overlay.classList.contains('open'))close();});
  ring.querySelectorAll('.cnav-link').forEach(function(l){l.addEventListener('click',close);});
  window.addEventListener('resize',function(){if(overlay.classList.contains('open'))pos();},{passive:true});
})();
</script>
